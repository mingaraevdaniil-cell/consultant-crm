<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки - Консульт CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <span class="logo">К</span>
                ООО Консульт
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-speedometer2"></i> Дашборд
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clients.html">
                            <i class="bi bi-people"></i> Клиенты
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="requests.html">
                            <i class="bi bi-clipboard-check"></i> Заявки
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container-fluid">
        <div class="row mb-4">
            <div class="col-md-6">
                <h2><i class="bi bi-clipboard-check"></i> Управление заявками</h2>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#requestModal" onclick="openRequestModal()">
                    <i class="bi bi-plus-circle"></i> Создать заявку
                </button>
            </div>
        </div>

        <!-- Фильтры -->
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="statusFilter" class="form-label">Фильтр по статусу:</label>
                <select class="form-select" id="statusFilter" onchange="loadRequests()">
                    <option value="">Все статусы</option>
                    <option value="Новая">Новая</option>
                    <option value="В работе">В работе</option>
                    <option value="Завершена">Завершена</option>
                    <option value="Отменена">Отменена</option>
                </select>
            </div>
        </div>

        <!-- Таблица заявок -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Клиент</th>
                            <th>Тип услуги</th>
                            <th>Статус</th>
                            <th>Стоимость</th>
                            <th>Дата создания</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTable">
                        <tr>
                            <td colspan="7" class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Загрузка...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования заявки -->
    <div class="modal fade" id="requestModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="requestModalTitle">Создать заявку</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="requestForm">
                        <input type="hidden" id="requestId">
                        <div class="mb-3">
                            <label for="clientSelect" class="form-label">Клиент *</label>
                            <select class="form-select" id="clientSelect" required>
                                <option value="">Выберите клиента...</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="serviceType" class="form-label">Тип услуги *</label>
                                <select class="form-select" id="serviceType" required>
                                    <option value="">Выберите услугу...</option>
                                    <option value="Консультация">Консультация</option>
                                    <option value="Аудит">Аудит</option>
                                    <option value="Сопровождение">Сопровождение</option>
                                    <option value="Юридические услуги">Юридические услуги</option>
                                    <option value="Бухгалтерские услуги">Бухгалтерские услуги</option>
                                    <option value="Налоговое консультирование">Налоговое консультирование</option>
                                    <option value="Другое">Другое</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">Статус *</label>
                                <select class="form-select" id="status" required>
                                    <option value="Новая">Новая</option>
                                    <option value="В работе">В работе</option>
                                    <option value="Завершена">Завершена</option>
                                    <option value="Отменена">Отменена</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="price" class="form-label">Стоимость (₽)</label>
                            <input type="number" class="form-control" id="price" min="0" step="0.01" value="0">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание задачи</label>
                            <textarea class="form-control" id="description" rows="4"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveRequest()">
                        <i class="bi bi-save"></i> Сохранить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/requests.js"></script>
</body>
</html>
