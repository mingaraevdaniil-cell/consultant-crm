<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд - Консульт CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <span class="logo">К</span>
                ООО Консульт
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="bi bi-speedometer2"></i> Дашборд
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clients.html">
                            <i class="bi bi-people"></i> Клиенты
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="requests.html">
                            <i class="bi bi-clipboard-check"></i> Заявки
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container-fluid">
        <div class="row mb-4">
            <div class="col">
                <h2 class="mb-3"><i class="bi bi-speedometer2"></i> Дашборд</h2>
            </div>
        </div>

        <!-- Карточки статистики -->
        <div class="row mb-4" id="statsCards">
            <div class="col-md-4 mb-3">
                <div class="card stat-card text-center">
                    <div class="card-body">
                        <i class="bi bi-people stat-icon text-primary"></i>
                        <h3 class="stat-value" id="totalClients">-</h3>
                        <p class="stat-label">Всего клиентов</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card stat-card text-center">
                    <div class="card-body">
                        <i class="bi bi-hourglass-split stat-icon text-warning"></i>
                        <h3 class="stat-value" id="activeRequests">-</h3>
                        <p class="stat-label">Активные заявки</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card stat-card text-center">
                    <div class="card-body">
                        <i class="bi bi-currency-dollar stat-icon text-success"></i>
                        <h3 class="stat-value" id="totalRevenue">-</h3>
                        <p class="stat-label">Общий доход</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Последние заявки -->
        <div class="row">
            <div class="col-12">
                <div class="table-container">
                    <h4 class="mb-3"><i class="bi bi-clock-history"></i> Последние обращения</h4>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Клиент</th>
                                    <th>Услуга</th>
                                    <th>Статус</th>
                                    <th>Стоимость</th>
                                    <th>Дата</th>
                                </tr>
                            </thead>
                            <tbody id="recentRequestsTable">
                                <tr>
                                    <td colspan="6" class="text-center">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Загрузка...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
